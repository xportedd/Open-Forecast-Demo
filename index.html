<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Forecast</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="wrapper">
        <div class="header">
            <h1>Open Forecast</h1>
        </div>
        <div class="card">
            <div class="searchbox">
                <input type="text" id="city-input" placeholder="Enter city name..." spellcheck="false" autocomplete="off">
                <button  type="submit" class="search-btn"><img src="images/search-icon.svg" alt="Search"></button>
            </div>
            <div class="error">
                <p class="error-message">City not found. Please try again.</p>
            </div>
            <div class="weather">
                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/clear-day.svg" alt="Weather Icon" class="weather-icon" width="160" height="160">
                <h1 class="temp">25°C</h1>
                <h2 class="city">Rome</h2>
                <div class="details">
                    <div class="col">
                        <img class="sm-icon" src="https://cdn.meteocons.com/3.0.0-next.10/svg-static/fill/humidity.svg" alt="Humidity Icon" width="80" height="80">
                        <div class="humidity-details">
                            <p class="humidity" id="value">60%</p>
                            <p class="label">Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img class="sm-icon" src="https://cdn.meteocons.com/3.0.0-next.10/svg-static/fill/wind.svg" alt="Wind Icon" width="80" height="80" viewBox="0 0 0 0">
                        <div class="wind-details">
                            <p class="wind" id="value">10 km/h</p>
                            <p class="label">Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Powered by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
    </div>

    <script src="scripts.js"></script>

</body>
</html>
